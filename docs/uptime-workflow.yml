# Checks the live site every 2 hours. If the site or its database does not answer, this job fails and GitHub
# emails the person who last edited this file (the owner). Change SITE_URL when the real domain is connected.
name: Uptime check

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

env:
  SITE_URL: https://outtake-studio.vercel.app

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the health endpoint
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors "$SITE_URL/api/health"
